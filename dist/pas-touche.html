<style>
/* Pas Touche ! — interface.
   Direction : musée la nuit. Cadres dorés, velours bordeaux, cartels crème, contour encré cartoon.
   --u est une unité d'échelle calculée en JS (petite sur téléphone, plus grande sur PC). */
:root {
  --ink: #2a1c16;
  --paper: #fff4dc;
  --paper-2: #f1dfb8;
  --velvet: #8c1d2f;
  --velvet-dark: #4f0e1c;
  --gold: #f2b632;
  --gold-dark: #b8831a;
  --night: #1b2140;
  --green: #3f9b4f;
  --red: #d8402f;
  --blue: #3d6fd6;
  --font-display: "Lilita One", "Arial Black", Impact, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --u: 1px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #120a10; color: var(--ink);
  font-family: var(--font-body); font-weight: 800;
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
img { -webkit-user-drag: none; pointer-events: none; }

#app { position: fixed; inset: 0; overflow: hidden; }
#game { position: absolute; inset: 0; display: block; }

/* ---------- Boutons ---------- */

  font-family: var(--font-display); font-size: calc(var(--u) * 22); letter-spacing: 0.02em; color: var(--ink);
  background: var(--gold); border: calc(var(--u) * 3) solid var(--ink); border-radius: calc(var(--u) * 14);
  box-shadow: 0 calc(var(--u) * 5) 0 var(--ink), inset 0 calc(var(--u) * -4) 0 rgba(0,0,0,0.15), inset 0 calc(var(--u) * 3) 0 rgba(255,255,255,0.45);
  transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink), inset 0 calc(var(--u) * -2) 0 rgba(0,0,0,0.15); }
.btn.big { min-height: calc(var(--u) * 64); font-size: calc(var(--u) * 32); padding: 0 calc(var(--u) * 40); }
.btn.red { background: #ef5a43; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }

.btn img { width: calc(var(--u) * 26); height: calc(var(--u) * 26); object-fit: contain; }

.btn-round {
  width: calc(var(--u) * 50); height: calc(var(--u) * 50); border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--font-display); font-size: calc(var(--u) * 20); color: var(--ink);
  background: var(--paper); border: calc(var(--u) * 3) solid var(--ink);

}
.btn-round:active { transform: translateY(calc(var(--u) * 3)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink); }
.btn-round svg { width: 55%; height: 55%; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }

  display: flex; align-items: flex-start; justify-content: space-between; gap: calc(var(--u) * 8);
  padding: calc(var(--u) * 10) max(calc(var(--u) * 12), env(safe-area-inset-right)) 0 max(calc(var(--u) * 12), env(safe-area-inset-left));
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.hud-left, .hud-right { display: flex; gap: calc(var(--u) * 8); align-items: center; }

}

.pill-wave { padding: 0 calc(var(--u) * 14); font-size: calc(var(--u) * 19); }

@keyframes hurt { 0%, 100% { transform: none; background: var(--paper); } 30% { transform: scale(1.15) rotate(-3deg); background: #ff8f80; } }

}

  width: calc(var(--u) * 36); height: calc(var(--u) * 36); border-radius: 50%; display: grid; place-items: center;
  background: #fff; border: calc(var(--u) * 3) solid var(--ink); position: relative;
}
.wave-btn .play::after { content: ""; border-left: calc(var(--u) * 12) solid var(--red); border-top: calc(var(--u) * 8) solid transparent; border-bottom: calc(var(--u) * 8) solid transparent; margin-left: calc(var(--u) * 3); }
.wave-btn .ring { position: absolute; inset: calc(var(--u) * -6); border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), transparent 0); -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%); mask: radial-gradient(circle, transparent 58%, #000 60%); }

#powers {

  display: flex; gap: calc(var(--u) * 10);
}

}

.power .key { position: absolute; right: calc(var(--u) * -4); bottom: calc(var(--u) * -4); font-family: var(--font-display); font-size: max(calc(var(--u) * 13), 11px); background: var(--ink); color: var(--paper); border-radius: calc(var(--u) * 6); padding: 0 calc(var(--u) * 5); }
.power.ready { animation: ready 1.6s 2; }
.power { transition: opacity 0.25s; }
.power.see-through { opacity: 0.4; }
.power.see-through:hover, .power.see-through:active { opacity: 1; }
@media (pointer: coarse) { .power .key { display: none; } }
.power.active { background: var(--gold); transform: scale(1.1); }
.power:active { transform: translateY(calc(var(--u) * 3)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink); }
@keyframes ready { 50% { box-shadow: 0 calc(var(--u) * 4) 0 var(--ink), 0 0 0 calc(var(--u) * 5) rgba(242,182,50,0.55); } }

#boss-bar {
  position: absolute; top: calc(var(--u) * 70); left: 50%; transform: translateX(-50%); width: min(60vw, calc(var(--u) * 420));
  font-family: var(--font-display); color: #fff; text-align: center; font-size: calc(var(--u) * 18); text-shadow: 0 2px 0 var(--ink);
}
#boss-bar .bar { height: calc(var(--u) * 16); background: var(--ink); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; margin-top: calc(var(--u) * 2); }
#boss-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(#b061e0, #6b2d8f); border-radius: 999px; transition: width 0.2s; }

#toast {
  position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%);
  font-family: var(--font-display); font-size: calc(var(--u) * 44); color: #fff; text-align: center; white-space: nowrap;
  -webkit-text-stroke: calc(var(--u) * 2) var(--ink); paint-order: stroke fill; text-shadow: 0 calc(var(--u) * 4) 0 var(--ink);
  pointer-events: none; opacity: 0;
}

#toast.show { animation: toast 1.9s ease-out; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

#taunt {
  position: absolute; left: 50%; bottom: calc(var(--u) * 12); transform: translateX(-50%);
  display: flex; align-items: center; gap: calc(var(--u) * 10); width: min(70vw, calc(var(--u) * 620));
  padding: calc(var(--u) * 8) calc(var(--u) * 16) calc(var(--u) * 8) calc(var(--u) * 8);
  background: var(--paper); border: calc(var(--u) * 3) solid var(--ink); border-radius: calc(var(--u) * 18);
  box-shadow: 0 calc(var(--u) * 5) 0 rgba(42,28,22,0.7);
  animation: slideup 0.35s ease-out;
}
#taunt img { width: calc(var(--u) * 64); height: calc(var(--u) * 64); border-radius: 50%; background: #6b2d8f; border: calc(var(--u) * 3) solid var(--ink); flex: none; }
#taunt p { margin: 0; font-size: max(calc(var(--u) * 17), 13px); line-height: 1.25; }
#taunt b { display: block; font-family: var(--font-display); font-weight: normal; color: #6b2d8f; font-size: max(calc(var(--u) * 15), 12.8px); letter-spacing: 0.04em; }
@keyframes slideup { from { transform: translate(-50%, 120%); } }

/* ---------- Menu radial ---------- */
#radial { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
#radial .ring-bg { position: absolute; border-radius: 50%; border: calc(var(--u) * 3) dashed rgba(255,255,255,0.7); pointer-events: none; animation: pop 0.18s ease-out; }
.r-item {
  position: absolute; width: calc(var(--u) * 64); height: calc(var(--u) * 64); margin: calc(var(--u) * -32) 0 0 calc(var(--u) * -32);
  border-radius: 50%; background: var(--paper); border: calc(var(--u) * 3) solid var(--ink);
  box-shadow: 0 calc(var(--u) * 4) 0 var(--ink); display: grid; place-items: center; padding: 0;
  animation: pop 0.2s ease-out backwards;
}
.r-item img { width: 86%; height: 86%; object-fit: contain; margin-top: calc(var(--u) * -6); }
.r-item .price {
  position: absolute; bottom: calc(var(--u) * -12); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; white-space: nowrap;
  font-family: var(--font-display); font-size: max(calc(var(--u) * 15), 12.8px); background: var(--gold); border: 2px solid var(--ink); border-radius: 999px; padding: 0 calc(var(--u) * 6);
}
.r-item.poor { filter: grayscale(0.9); }
.r-item.poor .price { background: #c9bfb5; color: #7a1f1f; }
.r-item.sel { background: var(--gold); transform: scale(1.12); }
.r-item.sel::after { content: "✔"; position: absolute; top: calc(var(--u) * -10); right: calc(var(--u) * -8); width: calc(var(--u) * 26); height: calc(var(--u) * 26); border-radius: 50%; background: var(--green); color: #fff; border: 2px solid var(--ink); display: grid; place-items: center; font-size: max(calc(var(--u) * 14), 11.9px); }
.r-item.sell { background: #ffd0c4; }

#tip {
  position: absolute; left: 50%; top: calc(var(--u) * 70); transform: translateX(-50%); z-index: 6;
  width: min(80vw, calc(var(--u) * 440)); padding: calc(var(--u) * 10) calc(var(--u) * 14);
  background: var(--paper); border: calc(var(--u) * 3) solid var(--ink); border-radius: calc(var(--u) * 14);
  box-shadow: 0 calc(var(--u) * 5) 0 rgba(42,28,22,0.7); pointer-events: none;
}

#tip .stats span { background: var(--paper-2); border-radius: calc(var(--u) * 8); padding: 0 calc(var(--u) * 7); font-size: max(calc(var(--u) * 13), 11px); }

/* ---------- Écrans ---------- */
.screen {
  position: absolute; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: max(calc(var(--u) * 14), env(safe-area-inset-top)) max(calc(var(--u) * 16), env(safe-area-inset-right)) max(calc(var(--u) * 14), env(safe-area-inset-bottom)) max(calc(var(--u) * 16), env(safe-area-inset-left));

#radial:not([hidden])::before { content: ""; position: fixed; inset: 0; background: rgba(20,10,5,0.28); pointer-events: none; }

.btn.notify { padding-right: calc(var(--u) * 26); }

/* Briefing en deux colonnes */

.brief .map { width: 100%; border: calc(var(--u) * 3) solid var(--ink); border-radius: calc(var(--u) * 6); display: block; }

@media (max-width: 560px) { .brief .cols { grid-template-columns: 1fr; } }

/* Jauges du Fichier des suspects */

  // Version mise en cache : chaque pose (type, couleurs, pas, sens, sac, liseré…) est dessinée

      o.revealed ? 1 : 0, o.moving === false ? 0 : 1, size, tq, halo ? 1 : 0, Math.round(sc * 20)].join('|');

  /* ---------- Atelier : arbre de talents ---------- */
  UI.atelierBranch = 'def';
  UI.atelierSel = null;
  function talentState(u, a) {
    var r = a.save.upgrades[u.id] || 0, max = u.costs.length;
    if (r >= max) return 'done';
    if (u.excl && (a.save.upgrades[u.excl] || 0) > 0) return 'banned';
    if (!PT.upgradeOpen(u.id, a.save.upgrades)) return 'locked';
    return a.starsFree() >= u.costs[r] ? 'buy' : 'poor';
  }
  // Pastille compacte : nom, rangs, prix
  // Talent = un rond avec son dessin, ses rangs en petits points, et son nom dessous.
  function pillHtml(u, a) {
    var r = a.save.upgrades[u.id] || 0, max = u.costs.length, st = talentState(u, a);
    var badge = st === 'locked' ? '<span class="badge"><img alt="" src="' + A.lockIcon() + '"></span>' : st === 'banned' ? '<span class="badge no">✕</span>' : st === 'done' ? '<span class="badge ok">✓</span>' : '';
    var pips = '';
    for (var k = 0; k < max; k++) pips += '<i class="' + (k < r ? 'on' : '') + '"></i>';
    return '<button class="pill-node ' + st + (r > 0 ? ' owned' : '') + (UI.atelierSel === u.id ? ' sel' : '') + '" data-id="' + u.id + '"' + (u.req ? ' data-req="' + u.req + '"' : '') + '>' +
      '<span class="dot"><img alt="" src="' + A.talentIcon(u.id) + '">' + badge + '</span><span class="pips">' + pips + '</span><span class="nm">' + esc(u.name) + '</span></button>';
  }
  function drawTreeLines(box, color) {
    // Traits fins entre les ronds ; positions de mise en page (insensibles à l'animation du cadre)
    var svg = box.querySelector('svg.links'), out = '';
    function dot(n) { var d = n.querySelector('.dot'); return { x: n.offsetLeft + d.offsetLeft + d.offsetWidth / 2, top: n.offsetTop + d.offsetTop, bot: n.offsetTop + d.offsetTop + d.offsetHeight }; }
    box.querySelectorAll('.pill-node[data-req]').forEach(function (n) {
      var p = box.querySelector('.pill-node[data-id="' + n.getAttribute('data-req') + '"]');
      if (!p) return;
      var A1 = dot(p), B1 = dot(n), y1 = A1.bot, y2 = B1.top, my = (y1 + y2) / 2, on = p.classList.contains('owned');
      // Le trait part du rond et contourne le nom du talent parent
      var yl = p.offsetTop + p.offsetHeight + 2;
      out += '<path d="M' + A1.x + ' ' + yl + ' C' + A1.x + ' ' + (yl + y2) / 2 + ' ' + B1.x + ' ' + (yl + y2) / 2 + ' ' + B1.x + ' ' + y2 + '" stroke="' + (on ? color : '#d6c9b3') + '"' + (on ? '' : ' stroke-dasharray="3 4"') + ' />';
    });
    svg.setAttribute('width', box.offsetWidth); svg.setAttribute('height', box.offsetHeight);
    svg.innerHTML = out;
  }

  // Redessine le contenu de l'Atelier sans rouvrir l'écran (garde la position de défilement)
  function renderAtelier(f, confirmReset) {
    var a = App();
    var scroll = f.scrollTop;
    var badge = document.querySelector('#scr-atelier .a-stars');
    if (badge) badge.innerHTML = starsBadge();
    var sel = PT.upgradeById(UI.atelierSel);
    if (!sel) sel = PT.UPGRADES.filter(function (u) { return talentState(u, a) === 'buy'; })[0] || PT.UPGRADES.filter(function (u) { return talentState(u, a) !== 'done'; })[0] || PT.UPGRADES[0];
    UI.atelierSel = sel.id;
    var br = PT.BRANCHES.filter(function (x) { return x.id === sel.branch; })[0];
    // Toute la marge de progression d'un coup d'œil
    var html = '<div class="atelier-top"><span><b>' + a.starsTotal() + '</b> étoiles gagnées sur ' + PT.LEVELS.length * PT.MAX_STARS + '</span><span><b>' + a.starsSpent() + '</b> investies</span><span><b>' + a.starsFree() + '</b> à dépenser</span></div>';
    html += '<div class="atelier-body" style="--bc:' + br.color + '"><div class="branches">';
    PT.BRANCHES.forEach(function (x) {
      var list = PT.UPGRADES.filter(function (u) { return u.branch === x.id; });
      var spent = 0, cap = 0;
      list.forEach(function (u) {
        var r = a.save.upgrades[u.id] || 0;
        for (var k = 0; k < u.costs.length; k++) { if (!u.excl || u.id < u.excl) cap += u.costs[k]; if (k < r) spent += u.costs[k]; }
      });
      html += '<div class="talent-tree" style="--bc:' + x.color + '"><svg class="links" aria-hidden="true"></svg>' +
        '<div class="bhead"><b>' + esc(x.name) + '</b><span class="bar"><i style="width:' + Math.round(100 * spent / cap) + '%"></i></span></div>';
      list.filter(function (u) { return u.path === 't'; }).forEach(function (u) { html += '<div class="trow">' + pillHtml(u, a) + '</div>'; });
      var pa = list.filter(function (u) { return u.path === 'a' && !u.excl; }), pb = list.filter(function (u) { return u.path === 'b' && !u.excl; });
      for (var i = 0; i < Math.max(pa.length, pb.length); i++) html += '<div class="trow two">' + (pa[i] ? pillHtml(pa[i], a) : '<span></span>') + (pb[i] ? pillHtml(pb[i], a) : '<span></span>') + '</div>';
      html += '<div class="trow two">';
      ['a', 'b'].forEach(function (p) {
        var duo = list.filter(function (u) { return u.path === p && u.excl; });
        html += '<div class="duo">' + pillHtml(duo[0], a) + pillHtml(duo[1], a) + '</div>';
      });
      html += '</div></div>';
    });
    html += '</div>';

    // Panneau de détail
    var r = a.save.upgrades[sel.id] || 0, max = sel.costs.length, st = talentState(sel, a);
    var why = st === 'banned' ? 'Vous avez choisi l’autre option : remboursez vos étoiles pour changer d’avis.' :
      st === 'locked' ? 'Achetez d’abord « ' + esc(PT.upgradeById(sel.req).name) + ' ».' : '';
    html += '<div class="talent-detail"><div class="td-head"><img alt="" src="' + A.talentIcon(sel.id) + '"><h3>' + esc(sel.name) + '</h3></div>' +
      (sel.excl ? '<span class="excl-tag">Au choix avec « ' + esc(PT.upgradeById(sel.excl).name) + ' »</span>' : '') +
      '<p class="rank">' + (sel.path === 't' ? 'Tronc commun' : 'Voie : ' + esc(br.paths[sel.path])) + ' · rang ' + r + ' / ' + max + '</p>' +
      (r > 0 ? '<p class="now">Actuel : ' + esc(sel.desc(r)) + '</p>' : '') +
      (r < max ? '<p class="next">' + (r > 0 ? 'Prochain : ' : '') + esc(sel.desc(r + 1)) + '</p>' : '<p class="next">Talent au maximum.</p>') +
      (why ? '<p class="why">' + why + '</p>' : '') +
      (r < max && (st === 'buy' || st === 'poor') ? '<button class="btn" id="a-buy"' + (st === 'poor' ? ' disabled' : '') + '><img alt="" src="' + A.starIcon(true) + '">Acheter · ' + sel.costs[r] + '</button>' +
        (st === 'poor' ? '<p class="why">Il vous manque ' + (sel.costs[r] - a.starsFree()) + ' étoile' + (sel.costs[r] - a.starsFree() > 1 ? 's' : '') + '.</p>' : '') : '') +
      '<div class="refund">' + (confirmReset ? '<span>Tout rembourser ?</span><button class="btn small ghost" id="a-no">Non</button><button class="btn small red" id="a-yes">Oui</button>' : '<button class="linkish" id="a-reset">Rembourser mes étoiles (gratuit)</button>') + '</div>' +
      '</div></div>';
    f.innerHTML = html;
    f.scrollTop = scroll;
    f.querySelectorAll('.talent-tree').forEach(function (box) { drawTreeLines(box, box.style.getPropertyValue('--bc')); });
    f.querySelectorAll('.pill-node').forEach(function (n) {
      click(n, function () { UI.atelierSel = n.getAttribute('data-id'); PT.Audio.play('click'); renderAtelier(f); });
    });
    if ($('a-buy')) click($('a-buy'), function () {
      if (a.buyUpgrade(sel.id)) {
        PT.Audio.play('upgrade'); renderAtelier(f);
        var bought = f.querySelector('.pill-node[data-id="' + sel.id + '"] .dot');
        if (bought) bought.classList.add('bought');

    if ($('a-reset')) click($('a-reset'), function () { renderAtelier(f, true); });
    if ($('a-no')) click($('a-no'), function () { renderAtelier(f); });
    if ($('a-yes')) click($('a-yes'), function () { a.save.upgrades = {}; a.persist(); PT.Audio.play('sell'); renderAtelier(f); });
  }

    App.levelIdx = idx;
    App.relax = !!relax;
    App.game = new PT.Game(lv, { upgrades: App.save.upgrades, relax: relax });
    App.renderer.setLevel(lv);
    App.scene = 'game';
    App.paused = false;
    App.speed = 1;
    UI.closeScreens();
    UI.hudInit(App.game);
    Au.music(lv.type === 'casse' ? 'heist' : 'game');
    if (lv.waves[0].crew) {
      App.paused = true;
      UI.showCrew(lv, 0, function () { App.paused = false; });
    }
  };

  App.quitToLevels = function (silent) {
    clearTimeout(App.resultTimer);
    App.scene = 'menu';
    App.game = null;
    App.paused = false;
    UI.hudHide();
    App.renderer.setLevel(App.demo.level);
    Au.music('menu');
    if (!silent) UI.showLevels();
  };

  App.pause = function () {
    if (App.scene !== 'game' || App.paused || App.game.state === 'won' || App.game.state === 'lost') return;
    App.paused = true;
    UI.closeRadial(); UI.stopAim();
    UI.showPause();
  };
  App.resume = function () { App.paused = false; UI.closeScreens(); };

  App.toggleSpeed = function () {
    App.speed = App.speed >= 3 ? 1 : App.speed + 1;
    UI.updateSpeed(App.speed);
  };

  App.callWave = function () {
    var g = App.game;
    if (!g || App.paused) return;
    if (g.startNextWave()) UI.closeRadial();
    else Au.play('error');
  };

  App.triggerPower = function (id) {
    var g = App.game;
    if (!g || App.paused) return;
    if (!g.powerReady(id)) { Au.play('error'); return; }
    if (PT.POWERS[id].target) {
      if (UI.aiming === id) UI.stopAim(); else { Au.play('click'); UI.startAim(id); }
      return;
    }
    UI.stopAim();
    g.usePower(id);
  };

  /* ---------- Événements du moteur ---------- */
  var SOUNDS = {
    build: 'build', upgrade: 'upgrade', sell: 'sell', bite: 'bite', splat: 'splat', net: 'net', hit: 'hit',
    catch: 'catch', escape: 'escape', grab: 'grab', return: 'coin', reveal: 'reveal', emp: 'emp', leap: 'leap',
    smoke: 'smoke', summon: 'summon', waveStart: 'whistle', bustFall: 'bustFall', bustImpact: 'boom',
    gust: 'gust', heal: 'heal', burrow: 'burrow', interest: 'coin',
    alarm: 'alarm', cafe: 'cafe', ticket: 'ticket', bonus: 'coin', win: 'win', lose: 'lose',
    clang: 'clang', shatter: 'shatter', mirror: 'mirror', blast: 'blast', lock: 'lock', unlock: 'unlock',
  };

  function handleEvents(g) {
    var evs = g.events;
    if (!evs.length) return;
    g.events = [];
    var demo = g === App.demo;
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      App.renderer.onEvent(ev, g);
      if (demo) continue;
      if (ev.type === 'shoot') Au.play(ev.tower === 'glu' ? 'glu' : ev.tower === 'canon' ? 'cannon' : 'throw');
      else if (ev.type === 'spawn' && ev.boss) Au.play('boss');
      else if (SOUNDS[ev.type]) Au.play(SOUNDS[ev.type]);
      onGameEvent(ev, g);
    }
  }

  function onGameEvent(ev, g) {
    var lv = g.level;
    switch (ev.type) {
      case 'waveStart':
        UI.toast('Vague ' + (ev.index + 1), ev.crew ? ev.crew.name : ev.index === lv.waves.length - 1 ? 'Dernière vague !' : '');
        (lv.taunts || []).forEach(function (t) { if (t.wave === ev.index) UI.taunt(t.text); });
        break;
      case 'briefing':
        if (g.state === 'playing') {
          App.paused = true;
          UI.closeRadial(); UI.stopAim();
          UI.showCrew(lv, ev.index, function () { App.paused = false; });
        }
        break;
      case 'spawn':
        if (!App.save.seen[ev.enemy]) { App.save.seen[ev.enemy] = 1; App.persist(); }
        if (ev.boss) UI.toast('Le Gentleman arrive !', 'Fumigènes et complices');
        break;
      case 'bonus':
        UI.toast('Bonus +' + ev.value, 'Vague appelée en avance');
        break;
      case 'lock':
        UI.toast('Portes verrouillées !', 'Personne ne sort pendant ' + Math.round(g.lockT) + ' secondes');
        break;
      case 'win': {
        var old = App.save.stars[lv.id] || 0, stars = g.stars;
        App.save.stars[lv.id] = Math.max(old, stars);
        if (App.save.fails) delete App.save.fails[lv.id];
        if (!old) UI.wing = null; // une nouvelle aile a pu s'ouvrir : on y retournera
        App.persist();
        UI.closeRadial(); UI.stopAim();
        App.resultTimer = setTimeout(function () {
          UI.showWin({ level: lv, stars: stars, gained: Math.max(0, stars - old), firstClear: old === 0, game: g });
        }, 1400);
        break;
      }
      case 'lose':
        App.save.fails = App.save.fails || {};
        App.save.fails[lv.id] = (App.save.fails[lv.id] || 0) + 1;
        App.persist();
        UI.closeRadial(); UI.stopAim();
        App.resultTimer = setTimeout(function () { UI.showLose({ level: lv, game: g }); }, 1400);
        break;
    }
  }

  /* ---------- Boucle ---------- */
  var last = 0, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, (now - (last || now)) / 1000);
    last = now;
    var inGame = App.scene === 'game' && App.game;
    var g = inGame ? App.game : App.demo;
    var running = g && !(inGame && App.paused);
    var mul = inGame ? App.speed : 1;
    if (running) {
      acc += dt * mul;
      var n = 0;
      while (acc >= STEP && n < 10) { g.update(STEP); acc -= STEP; n++; }
      if (n === 10) acc = 0;
      handleEvents(g);
    }
    App.renderer.render(g, inGame ? UI : null, running ? dt * mul : 0);
    if (inGame) {
      UI.updateHud(App.game);
      var beam = false;
      if (running) for (var i = 0; i < App.game.towers.length; i++) if (App.game.towers[i].beamOn) { beam = true; break; }
      Au.setHum(beam && App.save.sfx);
    } else Au.setHum(false);
  }

  /* ---------- Entrées ---------- */
  function bindInput() {
    var cv = document.getElementById('game');
    var down = null;
    cv.addEventListener('pointerdown', function (e) { Au.unlock(); down = { x: e.clientX, y: e.clientY }; });
    cv.addEventListener('pointerup', function (e) {
      if (!down) return;
      var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved < 16) tap(e.clientX, e.clientY);
    });
    cv.addEventListener('pointermove', function (e) {
      if (App.scene !== 'game' || !App.game) return;
      var w = App.renderer.toWorld(e.clientX, e.clientY);
      if (UI.aiming) UI.aim = w;
      var hot = UI.aiming || App.game.spotAt(w.x, w.y) || App.game.spotAt(w.x, w.y + 34);
      cv.style.cursor = hot ? 'pointer' : 'default';
    });
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    document.getElementById('btn-pause').addEventListener('click', function (e) { e.stopPropagation(); Au.play('click'); App.pause(); });
    document.getElementById('btn-speed').addEventListener('click', function (e) { e.stopPropagation(); Au.play('click'); App.toggleSpeed(); });
    document.getElementById('btn-wave').addEventListener('click', function (e) { e.stopPropagation(); Au.unlock(); App.callWave(); });

    window.addEventListener('keydown', function (e) {
      if (App.scene !== 'game' || !App.game) return;
      if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        if (UI.aiming) UI.stopAim();
        else if (UI.radialKind) UI.closeRadial();
        else if (App.paused && document.getElementById('scr-pause')) App.resume();
        else App.pause();
        e.preventDefault();
      } else if (App.paused) return;
      else if (e.key === ' ') { App.callWave(); e.preventDefault(); }
      else if (e.key === 'v' || e.key === 'V' || e.key === 'f' || e.key === 'F') App.toggleSpeed();
      else if (e.key >= '1' && e.key <= '4') { var id = PT.POWER_ORDER[+e.key - 1]; if (App.game.powers[id]) App.triggerPower(id); }
    });

    document.addEventListener('visibilitychange', function () { if (document.hidden) App.pause(); });
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  }

  function tap(cx, cy) {
    if (App.scene !== 'game' || !App.game || App.paused) return;
    var g = App.game, w = App.renderer.toWorld(cx, cy);
    if (g.state === 'won' || g.state === 'lost') return;
    if (UI.aiming) {
      if (w.x > 0 && w.x < PT.WORLD.W && w.y > PT.WORLD.WALL && w.y < PT.WORLD.H) {
        g.usePower(UI.aiming, w.x, w.y);
        UI.stopAim();
      }
      return;
    }
    var spot = g.spotAt(w.x, w.y) || g.spotAt(w.x, w.y + 34);
    if (spot) {
      if ((spot.tower && UI.selectedTower === spot.tower) || (!spot.tower && UI.selectedSpot === spot)) { UI.closeRadial(); return; }
      Au.play('click');
      if (spot.tower) UI.openTower(spot.tower); else UI.openBuild(spot);
    } else UI.closeRadial();
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    App.renderer.resize(w, h);
    var u = Math.max(0.58, Math.min(1.25, Math.min(w / 1280, h / 720) * 1.3));
    App.u = u;
    document.documentElement.style.setProperty('--u', u + 'px');
    UI.closeRadial();
    // Téléphone tenu en portrait : l'écran « tournez votre téléphone » s'affiche, on met en pause.
    if (matchMedia('(orientation: portrait) and (pointer: coarse)').matches) App.pause();
  }

  /* ---------- Démarrage ---------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    App.save = loadSave();
    // Sauvegarde d’une ancienne version : si les talents coûtent plus que les étoiles gagnées, on rembourse tout
    // Passage à 5 étoiles par salle : on convertit les anciennes notes sur 3
    if (App.save.starScale !== 5) {
      var conv = { 1: 1, 2: 3, 3: 5 };
      for (var sid in App.save.stars) App.save.stars[sid] = conv[App.save.stars[sid]] || App.save.stars[sid];
      App.save.starScale = 5; App.persist();
    }
    if (App.save.talents !== 3 || App.starsSpent() > App.starsTotal()) {
      var had = Object.keys(App.save.upgrades).length > 0;
      App.save.upgrades = {}; App.save.talents = 3; App.persist();
      if (had) setTimeout(function () { UI.toast('Nouvel Atelier !', 'Vos étoiles vous sont rendues'); }, 800);
    }
    Au.musicOn = App.save.music; Au.sfxOn = App.save.sfx;
    App.renderer = new PT.Renderer(document.getElementById('game'));
    resize();
    makeDemo();
    bindInput();
    UI.showTitle();
    Au.music('menu');
    requestAnimationFrame(frame);
    // L'audio ne peut démarrer qu'après une interaction.
    var unlock = function () { Au.unlock(); Au.setMusic(App.save.music); Au.setSfx(App.save.sfx); };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });
  }

  function whenFontsReady(cb) {
    var done = false, go = function () { if (!done) { done = true; cb(); } };
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('20px "Lilita One"'), document.fonts.load('800 16px "Nunito"')]).then(go, go);
      setTimeout(go, 1800);
    } else go();
  }

  document.addEventListener('DOMContentLoaded', function () { whenFontsReady(boot); });
})(globalThis.PT = globalThis.PT || {});

</script>
</body>
</html>
