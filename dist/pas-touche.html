<style>
/* Pas Touche ! — interface.

:root {

  color-scheme: dark;
}

#app { position: fixed; inset: 0; overflow: hidden; }

  /* ================= Image par image ================= */
  R.render = function (game, ui, dt) {
    var c = this.ctx;
    this.time += dt;
    var time = this.time;
    this.updateFx(dt, game);
    if (this.alarmT > 0) this.alarmT -= dt;
    if (this.redFlash > 0) this.redFlash -= dt;

    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = this.level ? this.level.theme.wallDark : '#111';
    c.fillRect(0, 0, this.canvas.width, this.canvas.height);
    if (!game || !this.bg) return;

    var shx = 0, shy = 0;
    if (this.shake > 0) { this.shake = Math.max(0, this.shake - dt * 30); shx = (Math.random() - 0.5) * this.shake; shy = (Math.random() - 0.5) * this.shake; }
    c.setTransform(this.scale, 0, 0, this.scale, this.ox + shx * this.scale, this.oy + shy * this.scale);
    c.drawImage(this.bg, -MX, -MY, W + 2 * MX, H + 2 * MY);

    var i;
    // Flaques de glu
    for (i = 0; i < game.puddles.length; i++) drawPuddle(c, game.puddles[i], time);
    // Filets au sol
    for (i = 0; i < this.decals.length; i++) drawNetDecal(c, this.decals[i]);
    // Champ de vision des caméras
    for (i = 0; i < game.towers.length; i++) if (game.towers[i].type === 'camera') drawCameraRange(c, game, game.towers[i], time);

    if (this.night) c.drawImage(this.night, -MX, -MY, W + 2 * MX, H + 2 * MY);

    // Socles libres
    var minCost = Infinity;
    game.availableTowers.forEach(function (id) { minCost = Math.min(minCost, PT.TOWERS[id].cost); });
    for (i = 0; i < game.spots.length; i++) {
      var s = game.spots[i];
      if (!s.tower) drawSpot(c, s, game.coins >= minCost, ui && ui.selectedSpot === s, time);
    }
    // Aperçu de portée
    if (ui && ui.preview) drawRange(c, ui.preview);

    // Entités triées par profondeur
    var list = [];
    for (i = 0; i < game.towers.length; i++) list.push({ y: game.towers[i].y, k: 0, o: game.towers[i] });
    for (i = 0; i < game.enemies.length; i++) list.push({ y: game.enemies[i].y, k: 1, o: game.enemies[i] });
    list.push({ y: game.treasure.y, k: 2 });
    list.sort(function (a, b) { return a.y - b.y; });
    for (i = 0; i < list.length; i++) {
      var it = list[i];
      if (it.k === 0) this.drawTower(c, game, it.o, time, ui);
      else if (it.k === 1) this.drawEnemy(c, game, it.o, time);
      else { c.save(); c.translate(game.treasure.x, game.treasure.y); A.treasure(c, game.level.treasure.kind, game.inRoom > 0, time, this.alarmT); c.restore(); }
    }

    if (game.lockT > 0) this.drawLocks(c, game, time);

    // Rayons laser
    for (i = 0; i < game.towers.length; i++) { var t = game.towers[i]; if (t.beamOn && t.target) drawBeam(c, t, time); }
    // Projectiles
    for (i = 0; i < game.projectiles.length; i++) A.projectile(c, game.projectiles[i]);
    // Bustes qui tombent
    for (i = 0; i < game.drops.length; i++) drawDrop(c, game.drops[i]);
    // Effets
    this.drawFx(c, time);
    // Visée du pouvoir
    if (ui && ui.aim) {
      c.save(); c.setLineDash([8, 8]); c.lineDashOffset = -time * 30;
      circ(c, ui.aim.x, ui.aim.y, PT.POWERS.buste.radius); c.fillStyle = 'rgba(255,212,71,0.15)'; c.fill();
      c.lineWidth = 3; c.strokeStyle = '#ffd447'; c.stroke(); c.restore();
    }

    // Écran : flash rouge, alarme, café
    c.setTransform(1, 0, 0, 1, 0, 0);
    var cw = this.canvas.width, ch = this.canvas.height, g;
    if (this.redFlash > 0 || game.freezeT > 0) {
      var a = Math.max(this.redFlash / 0.6, game.freezeT > 0 ? 0.35 + 0.25 * Math.sin(time * 14) : 0);
      g = c.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.35, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);
      g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, 'rgba(255,30,30,' + (0.55 * Math.min(1, a)) + ')');
      c.fillStyle = g; c.fillRect(0, 0, cw, ch);
    }
    if (game.cafeT > 0) {
      g = c.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.4, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);
      g.addColorStop(0, 'rgba(255,170,60,0)'); g.addColorStop(1, 'rgba(255,170,60,0.28)');
      c.fillStyle = g; c.fillRect(0, 0, cw, ch);

  };

    c.save(); c.globalAlpha = Math.max(0, a);
    game.level.paths.forEach(function (p) {

  /* ---------- Briefing avant la salle ---------- */
  function enemiesOf(level) {
    var types = [];
    level.waves.forEach(function (w) { w.groups.forEach(function (g) { if (types.indexOf(g.t) < 0) types.push(g.t); }); });
    return PT.ENEMY_ORDER.filter(function (t) { return types.indexOf(t) >= 0; });
  }
  UI.newThings = function (level) {
    var before = [];
    PT.LEVELS.forEach(function (l) { if (l.id < level.id) enemiesOf(l).forEach(function (t) { if (before.indexOf(t) < 0) before.push(t); }); });
    return {
      enemies: enemiesOf(level).filter(function (t) { return before.indexOf(t) < 0; }),
      towers: PT.TOWER_ORDER.filter(function (t) { return PT.TOWERS[t].unlock === level.id; }),
      powers: PT.POWER_ORDER.filter(function (p) { return PT.POWERS[p].unlock === level.id; }),
    };
  };
  function chip(img, name, kind, wide) {
    return '<div class="chip' + (wide ? ' wide' : '') + '"><img alt="" src="' + img + '"><span><small>' + esc(kind) + '</small>' + esc(name) + '</span></div>';
  }
  function card(img, name, desc, tag, tagCls) {
    return '<div class="card"><img alt="" src="' + img + '"><div><b>' + esc(name) + (tag ? '<span class="tag ' + (tagCls || '') + '">' + tag + '</span>' : '') + '</b><small>' + esc(desc) + '</small></div></div>';
  }

        var old = App.save.stars[lv.id] || 0, stars = g.stars;
        App.save.stars[lv.id] = Math.max(old, stars);
        App.persist();
        UI.closeRadial(); UI.stopAim();
        App.resultTimer = setTimeout(function () {
          UI.showWin({ level: lv, stars: stars, gained: Math.max(0, stars - old), firstClear: old === 0, game: g });
        }, 1400);
        break;
      }
      case 'lose':
        UI.closeRadial(); UI.stopAim();
        App.resultTimer = setTimeout(function () { UI.showLose({ level: lv, game: g }); }, 1400);
        break;
    }
  }

  /* ---------- Boucle ---------- */
  var last = 0, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.1, (now - (last || now)) / 1000);
    last = now;
    var inGame = App.scene === 'game' && App.game;
    var g = inGame ? App.game : App.demo;
    var running = g && !(inGame && App.paused);
    var mul = inGame ? App.speed : 1;
    if (running) {
      acc += dt * mul;
      var n = 0;
      while (acc >= STEP && n < 10) { g.update(STEP); acc -= STEP; n++; }
      if (n === 10) acc = 0;
      handleEvents(g);
    }
    App.renderer.render(g, inGame ? UI : null, running ? dt * mul : 0);
    if (inGame) {
      UI.updateHud(App.game);
      var beam = false;
      if (running) for (var i = 0; i < App.game.towers.length; i++) if (App.game.towers[i].beamOn) { beam = true; break; }
      Au.setHum(beam && App.save.sfx);
    } else Au.setHum(false);
  }

  /* ---------- Entrées ---------- */
  function bindInput() {
    var cv = document.getElementById('game');
    var down = null;
    cv.addEventListener('pointerdown', function (e) { Au.unlock(); down = { x: e.clientX, y: e.clientY }; });
    cv.addEventListener('pointerup', function (e) {
      if (!down) return;
      var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      down = null;
      if (moved < 16) tap(e.clientX, e.clientY);
    });
    cv.addEventListener('pointermove', function (e) {
      if (App.scene !== 'game' || !App.game) return;
      var w = App.renderer.toWorld(e.clientX, e.clientY);
      if (UI.aiming) UI.aim = w;
      var hot = UI.aiming || App.game.spotAt(w.x, w.y) || App.game.spotAt(w.x, w.y + 34);
      cv.style.cursor = hot ? 'pointer' : 'default';
    });
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    document.getElementById('btn-pause').addEventListener('click', function (e) { e.stopPropagation(); Au.play('click'); App.pause(); });
    document.getElementById('btn-speed').addEventListener('click', function (e) { e.stopPropagation(); Au.play('click'); App.toggleSpeed(); });
    document.getElementById('btn-wave').addEventListener('click', function (e) { e.stopPropagation(); Au.unlock(); App.callWave(); });

    window.addEventListener('keydown', function (e) {
      if (App.scene !== 'game' || !App.game) return;
      if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
        if (UI.aiming) UI.stopAim();
        else if (UI.radialKind) UI.closeRadial();
        else if (App.paused && document.getElementById('scr-pause')) App.resume();
        else App.pause();
        e.preventDefault();
      } else if (App.paused) return;
      else if (e.key === ' ') { App.callWave(); e.preventDefault(); }
      else if (e.key === 'v' || e.key === 'V' || e.key === 'f' || e.key === 'F') App.toggleSpeed();
      else if (e.key >= '1' && e.key <= '4') { var id = PT.POWER_ORDER[+e.key - 1]; if (App.game.powers[id]) App.triggerPower(id); }
    });

    document.addEventListener('visibilitychange', function () { if (document.hidden) App.pause(); });
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  }

  function tap(cx, cy) {
    if (App.scene !== 'game' || !App.game || App.paused) return;
    var g = App.game, w = App.renderer.toWorld(cx, cy);
    if (g.state === 'won' || g.state === 'lost') return;
    if (UI.aiming) {
      if (w.x > 0 && w.x < PT.WORLD.W && w.y > PT.WORLD.WALL && w.y < PT.WORLD.H) {
        g.usePower(UI.aiming, w.x, w.y);
        UI.stopAim();
      }
      return;
    }
    var spot = g.spotAt(w.x, w.y) || g.spotAt(w.x, w.y + 34);
    if (spot) {
      if ((spot.tower && UI.selectedTower === spot.tower) || (!spot.tower && UI.selectedSpot === spot)) { UI.closeRadial(); return; }
      Au.play('click');
      if (spot.tower) UI.openTower(spot.tower); else UI.openBuild(spot);
    } else UI.closeRadial();
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    App.renderer.resize(w, h);
    var u = Math.max(0.58, Math.min(1.25, Math.min(w / 1280, h / 720) * 1.3));
    App.u = u;
    document.documentElement.style.setProperty('--u', u + 'px');
    UI.closeRadial();
    // Téléphone tenu en portrait : l'écran « tournez votre téléphone » s'affiche, on met en pause.
    if (matchMedia('(orientation: portrait) and (pointer: coarse)').matches) App.pause();
  }

  /* ---------- Démarrage ---------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    App.save = loadSave();
    Au.musicOn = App.save.music; Au.sfxOn = App.save.sfx;
    App.renderer = new PT.Renderer(document.getElementById('game'));
    resize();
    makeDemo();
    bindInput();
    UI.showTitle();
    Au.music('menu');
    requestAnimationFrame(frame);
    // L'audio ne peut démarrer qu'après une interaction.
    var unlock = function () { Au.unlock(); Au.setMusic(App.save.music); Au.setSfx(App.save.sfx); };
    window.addEventListener('pointerdown', unlock, { once: true });
    window.addEventListener('keydown', unlock, { once: true });
  }

  function whenFontsReady(cb) {
    var done = false, go = function () { if (!done) { done = true; cb(); } };
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('20px "Lilita One"'), document.fonts.load('800 16px "Nunito"')]).then(go, go);
      setTimeout(go, 1800);
    } else go();
  }

  document.addEventListener('DOMContentLoaded', function () { whenFontsReady(boot); });
})(globalThis.PT = globalThis.PT || {});

</script>
</body>
</html>
